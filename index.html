<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RickandMorty</title>
    <link rel="stylesheet" href="style.css">
</head>

    <h1 class="title">Каталог Персонажів</h1>
    <div class="panel"></div> 
    <input type="text" class="search" placeholder="Ведіть імя персонажа">
    <select class="status-filter">
        <option value="">Усі статуси</option>
        <option value="alive">живі</option>
        <option value="dead">метрві</option>
        <option value="unknown">Невідомі</option>

    </select>
    <button class="search-button">Пошук</button>
    <p class="status"></p>
    <div class="cards"></div>
    <button class="refresh">Оновити</button>
    
</body>
<script src="script.js"></script>
</html>
